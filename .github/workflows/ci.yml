# Adapted from .claude/skills/tm-new-project/templates/ci.yml.
#
# This repo has no install, typecheck, lint, build, or e2e step: no
# dependencies, no lockfile, no application runtime (see CLAUDE.md's
# "Useful commands"). The template's staged checks/build/e2e jobs collapse
# to the one stage this repo actually has: unit tests. The version-bump job
# is specific to this repo, not part of the template.

name: CI

on:
  pull_request:
    # labeled/unlabeled re-run the version-bump job when skip-version-bump
    # is added or removed. The test job re-runs too, on purpose: if it
    # skipped label events, a label added right after a push would cancel
    # the in-progress test run and leave only a skipped, green test job.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# No paths-ignore: the markdown here is test input, not inert prose.
# .claude/workflows/__tests__/effort-policy.test.mjs reads .claude/agents/*.md
# frontmatter, so a docs/** or **.md skip would let a PR that breaks that
# suite (for example editing architect.md's model pin) skip CI entirely.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22 is a floor, not a preference: npm test's glob (see
          # scripts/test.mjs) relies on fs.globSync, added in Node 22.0.0,
          # so the effective floor is 22.0.0, not the 21.7.3 that sufficed
          # before the fail-on-empty-test-run wrapper existed.
          node-version: '22'
          # No cache: 'npm' here. There is no lockfile for setup-node's
          # cache-path resolution to key off, so it would fail.
      - run: npm test

  version-bump:
    name: Plugin version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # The pull_request checkout is the merge commit. Depth 2 also
          # fetches its first parent, the base tip that HEAD^1 names.
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/check-version-bump.mjs --base HEAD^1
        env:
          # Via env, not inline in run: label names are user-controlled.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
